/* ================= BACKGROUND ================= */

body{

.stars{

.star{
    position:absolute;
    width:3px;
    height:3px;
    background:white;
    border-radius:50%;
    box-shadow:0 0 10px white;
    animation:twinkle 2s infinite alternate;
}

@keyframes twinkle{
    from{opacity:.2;transform:scale(.5);}
    to{opacity:1;transform:scale(1.5);}
}

/* ================= PAGE ================= */

.page{
    position:absolute;
    inset:0;
    display:none;
    justify-content:center;
    align-items:center;
    text-align:center;
    padding:25px;
}

.page.active{

    animation:pageIn 1s ease;
}

@keyframes pageIn{
    0%{
        opacity:0;
        transform:scale(1.2);
        filter:blur(15px);
    }
    100%{
        opacity:1;
        transform:scale(1);
        filter:blur(0);
    }
}

.content{
    width:min(900px,94%);

    z-index:5;
}

.small{

}

.title{

}

@keyframes shine{

    100%{background-position:200%;}
}

.poem{

}

.highlight{

}

.tap{

    font-size:14px;
    letter-spacing:3px;
    color:#bbb;
    animation:pulse 1.5s infinite;
}

@keyframes pulse{
    50%{opacity:.25;}
}

/* ================= HEART ================= */

.bigHeart{
    font-size:100px;
    animation:heartbeat 1.1s infinite;
    filter:drop-shadow(0 0 30px #ff1979);
}

@keyframes heartbeat{
    0%,100%{transform:scale(1);}
    15%{transform:scale(1.2);}
    30%{transform:scale(1);}
    45%{transform:scale(1.15);}
}

/* ================= PHOTO FRAME ================= */

.orbit{
    width:230px;
    height:230px;
    margin:0 auto 25px;
    border:2px solid #ff5b9c;
    border-radius:50%;
    box-shadow:
        0 0 30px #ff287f,
        inset 0 0 30px #ff287f;
    display:flex;
    justify-content:center;
    align-items:center;
    animation:orbit 8s linear infinite;
}

@keyframes orbit{
    to{transform:rotate(360deg);}
}

.orbit span{
    font-size:85px;
    animation:counter 8s linear infinite;
}

@keyframes counter{
    to{transform:rotate(-360deg);}
}

/* ================= BUTTON ================= */

.buttons{
    margin-top:25px;
}

button{
    border:0;
    padding:15px 35px;
    margin:8px;
    border-radius:50px;
    color:white;
    background:linear-gradient(90deg,#ff176f,#ff65aa);
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
    box-shadow:0 0 25px #ff247f;
    transition:.3s;
}

button:hover{
    transform:scale(1.12);
}

.no{
    background:#24202a;
    box-shadow:none;
}

/* ================= FLOATING HEARTS ================= */

.heart{
    position:fixed;
    bottom:-50px;
    pointer-events:none;
    animation:floatUp linear forwards;
    z-index:2;
}

@keyframes floatUp{
    0%{
        transform:translateY(0) scale(.5) rotate(0);
        opacity:0;
    }
    15%{opacity:1;}
    100%{
        transform:translateY(-110vh) scale(1.5) rotate(360deg);
        opacity:0;
    }
}

/* ================= FINAL ================= */

.finalName{
    font-size:clamp(45px,11vw,100px);
    font-weight:900;
    color:#fff;
    text-shadow:
        0 0 10px #ff3d91,
        0 0 30px #ff3d91,
        0 0 60px #ff3d91;
}

.loveText{
    font-size:clamp(22px,5vw,40px);
    line-height:1.6;
}

/* ================= CONFETTI ================= */

.confetti{
    position:fixed;
    top:-20px;
    width:10px;
    height:18px;
    animation:confettiFall 4s linear forwards;
    z-index:100;
}

@keyframes confettiFall{
    to{
        transform:translateY(110vh) rotate(720deg);
    }
}

/* Mobile */

}
</style>

/* ================= TYPEWRITER ================= */

function typeText(element,html){

    element.innerHTML="";

    let temp=document.createElement("div");

    temp.innerHTML=html;

    let text=temp.innerHTML;

    let i=0;

    function type(){

        if(i<text.length){

            element.innerHTML=text.substring(0,i+1);

            i++;

            setTimeout(type,18);

        }

    }

    type();
}

    current++;

    if(current>5){

    setTimeout(()=>{

        let next=document.getElementById("p"+current);

        next.classList.add("active");

        typeText(
            document.getElementById("text"+current),
            texts[current]
        );

        locked=false;

}
