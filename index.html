/* ================= TYPEWRITER ================= */

function typeText(element,html){

element.innerHTML="";

let temp=document.createElement("div");
temp.innerHTML=html;

let chars=[...temp.innerHTML];
let i=0;

function write(){

if(i<chars.length){

element.innerHTML=
chars.slice(0,i+1).join("");

i++;

setTimeout(write,14);

}

}

write();

}
